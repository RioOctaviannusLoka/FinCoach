name: Daily Model Fine-tuning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # tiap hari jam 00:00 UTC

jobs:
  retrain-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          lfs: true
          fetch-depth: 0  # Ambil seluruh riwayat commit
          ref: AI

      - name: Pull LFS files
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Retraining Script
        run: python retrain.py

      - name: Push to Hugging Face Model Repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git add .
          git commit -m "Auto fine-tuning at $(date)"
          git push https://user:${HF_TOKEN}@huggingface.co/spaces/riooctaviannusloka/fincoach-model AI:main

          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} AI